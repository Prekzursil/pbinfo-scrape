# osv-scanner configuration.
#
# SCOPE: osv-scanner loads this file only for lockfiles in this same directory
# (here: package-lock.json). It suppresses exactly the advisory IDs listed below
# and nothing else - there is no package-wide, ecosystem-wide or
# dependency-group suppression, and the blocking `Dependencies (osv-scanner)`
# gate in .github/workflows/quality.yml stays fully in force for every other
# finding. Every runtime advisory currently published is fixed in
# package-lock.json at the versions we resolve (undici 7.30.1, zod 4.6.7,
# qs 6.16.1, body-parser 2.4.0, ip-address 10.7.5, proxy-addr 2.0.8).
#
# SCHEMA: inside [[IgnoredVulns]] only `id`, `ignoreUntil` and `reason` are valid
# keys. osv-scanner rejects the ENTIRE file on any unknown key and then silently
# falls back to an empty config (internal/config/manager.go, tryLoadConfig ->
# "unknown keys in config file"), so further context lives in comments like these
# rather than in extra keys.
#
# 2026-10-25 sweep: `npm update` plus the undici override bump to 7.30.1 cleared
# every in-range advisory (~40 findings incl. the former brace-expansion ignore
# GHSA-mh99-v99m-4gvg, whose 1.1.21 / 2.1.7 / 5.0.12 copies we now resolve, so
# that entry was DELETED). What remains below are dev-toolchain advisories whose
# only fix is a breaking major upgrade of the pinned desktop/test stack, taken
# deliberately rather than smuggled into an unrelated PR.

