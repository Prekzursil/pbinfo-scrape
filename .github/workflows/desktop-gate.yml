name: Desktop Gate

# The checks the QZP lean gate (quality.yml -> `quality / quality`) does not
# run for this repository. They moved here, unchanged, from the in-repo
# `Quality Gate` this repository used before the lean-gate caller:
#   - the desktop typecheck (tsconfig.desktop.json) next to the repo's own
#     oxlint run and CLI typecheck;
#   - the Windows test suite and CLI build (the app is Windows-targeted: the
#     suite asserts Windows path semantics), and the 100% coverage run on
#     Windows; the lean gate measures coverage on Linux;
#   - Semgrep registry rulesets (p/typescript, p/javascript, p/secrets) over
#     src/; the lean gate's opengrep runs .quality/opengrep;
#   - gitleaks over the full history; the lean gate scans a depth-1 checkout.
# Dependencies are not re-checked here: the lean gate's osv-scanner (gate 6)
# replaced the old osv-scanner job.
#
# `desktop-gate` is the fail-closed aggregate of the jobs above.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # never `quality-...`: the lean-gate caller owns that group, and sharing it
  # would let one workflow cancel the other on the same pull request
  group: desktop-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-types:
    name: Desktop lint & types (oxlint, tsc CLI + desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck (cli/library)
        run: npm run typecheck
      - name: Typecheck (desktop)
        run: npm run typecheck:desktop

  test:
    name: Windows tests & build
    # Windows-targeted desktop app: the suite asserts Windows path semantics and
    # Chromium-on-Windows cookie-profile resolution, so the tests run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unit & integration tests
        run: npm test
      - name: Build
        run: npm run build

  coverage:
    name: Windows coverage (100% enforced)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Coverage (100% line + branch enforced)
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report-windows
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  sast:
    name: SAST (Semgrep registry rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        run: semgrep scan --config p/typescript --config p/javascript --config p/secrets --error --metrics off src

  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-gate:
    name: desktop-gate
    runs-on: ubuntu-latest
    needs: [lint-and-types, test, coverage, sast, secrets]
    # Fail closed: run even when a needed job failed or was skipped, and pass
    # only when every one of them succeeded.
    if: always()
    timeout-minutes: 5
    steps:
      - name: All desktop gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error title=desktop-gate::a desktop gate job did not succeed (results: $RESULTS)"
              exit 1
            fi
          done
          echo "Desktop gate green - oxlint + CLI/desktop typecheck, Windows tests + build, Windows 100% coverage, Semgrep registry rules, full-history gitleaks."
