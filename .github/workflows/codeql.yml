# CodeQL baseline — thin caller of quality-zero-platform's reusable workflow.
#
# Keeps this repo's declared scan scope by passing its codeql-config.yml
# (paths-ignore: archive/ = verbatim third-party site snapshots, tests/ =
# scaffolding; queries: security-and-quality — see that file for the full
# rationale). Fail-closed unless the analysis succeeds; the platform is
# checked out at this file's own workflow SHA (job.workflow_sha).
name: codeql

permissions:
  actions: read
  contents: read
  security-events: write

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-codeql.yml@d441b32790c4aa10e1f209539ec0ddc25114968b
    with:
      repo_slug: ${{ github.repository }}
      event_name: ${{ github.event_name }}
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      codeql_config_file: ./.github/codeql/codeql-config.yml
